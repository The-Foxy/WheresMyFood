name: Publish release packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm test
      - run: node --check src/content.js
      - run: node --input-type=module -e "await import('./src/app.js')"
      - run: python -m unittest discover -s tests/updater -v
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('manifest.json'))['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and manifest versions must match'
          PY
      - run: python tools/package.py
      - name: Publish both assets before making the release visible
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG" dist/snappfood-assistant.zip dist/wheresmyfood-setup.zip
          gh release edit "$RELEASE_TAG" --draft=false --latest
